[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-course-recommender"
version = "0.1.0"
description = "An explainable faculty-module ranking and cross-department teaching collaboration system."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "joblib>=1.4,<2",
    "networkx>=3.3,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rapidfuzz>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "tenacity>=9.0,<10"
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0,<6"
]

api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1"
]

ui = [
    "streamlit>=1.38,<2"
]

dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"